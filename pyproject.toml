[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[project]
name = "telegram-uploadbot"
version = "2.0.0"
description = "Stream Telegram files to File2Share without temporary files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Telethon==1.45.0",
  "aiohttp==3.14.5",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
speed = [
  "cryptg==0.6.0",
  "uvloop==0.23.0; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
]
[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
  "pip-audit==2.10.1",
]

[project.scripts]
uploadbot = "uploadbot.app:main"
uploadbot-decrypt = "uploadbot.encryption:main"

[project.urls]
Repository = "https://github.com/IlyaKhalafi/UploadBot"
Issues = "https://github.com/IlyaKhalafi/UploadBot/issues"

[tool.uv.build-backend]
module-name = "uploadbot"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
