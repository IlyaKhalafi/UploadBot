[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-uploadbot"
version = "2.0.0"
description = "Stream Telegram files to transfer.sh without temporary files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Telethon==1.45.0",
  "aiohttp==3.14.5",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
speed = [
  "cryptg==0.6.0",
  "uvloop==0.23.0; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
  "pip-audit==2.10.1",
]

[project.scripts]
uploadbot = "main:main"

[project.urls]
Repository = "https://github.com/IlyaKhalafi/UploadBot"
Issues = "https://github.com/IlyaKhalafi/UploadBot/issues"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["plugins*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
